<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bagrut 5 Points - Master</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #4F46E5;
            --accent: #7C3AED;
            --background-grad: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Rubik', sans-serif;
            background: var(--background-grad);
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            color: var(--text-main); overflow: hidden; user-select: none;
        }

        .app-container {
            background: var(--card-bg);
            width: 100%; max-width: 480px; height: 95vh;
            border-radius: 20px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255,255,255,0.8);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        /* --- Admin Panel --- */
        #admin-panel {
            display: none; position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); width: 260px;
            background: #0f172a; color: #38bdf8; z-index: 9999; border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); direction: ltr; border: 1px solid #334155;
            font-family: monospace;
        }
        .adm-header { padding: 10px; background: #1e293b; border-radius: 12px 12px 0 0; display:flex; justify-content:space-between; font-weight:bold; cursor:move; }
        .adm-content { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .adm-btn { background: #334155; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size:12px; }
        .adm-btn:hover { background: #475569; color: #38bdf8; }

        /* --- Screens --- */
        .screen { display: none; flex: 1; flex-direction: column; padding: 20px; overflow-y: auto; }
        .screen.active { display: flex; animation: slideIn 0.3s ease-out; }

        /* --- Typography & Buttons --- */
        h1 { margin: 0; font-weight: 800; font-size: 2rem; color: var(--primary); text-align: center; }
        .main-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; border: none; padding: 16px; border-radius: 14px;
            font-size: 18px; font-weight: 700; width: 100%; margin-top: 15px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); transition: 0.2s;
        }
        .main-btn:active { transform: scale(0.98); }
        .main-btn.secondary { background: white; color: var(--text-muted); border: 2px solid #e2e8f0; box-shadow: none; }
        
        input { padding: 16px; width: 100%; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 18px; font-family: 'Rubik', sans-serif; text-align: center; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }

        /* --- Game UI --- */
        .passage-container {
            background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px;
            font-size: 15px; line-height: 1.6; max-height: 25vh; overflow-y: auto;
            color: #334155; direction: ltr; border-left: 4px solid var(--accent);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }
        .passage-title { font-weight: 800; font-size: 16px; margin-bottom: 8px; color: var(--primary); }

        .question-text { font-size: 18px; font-weight: 700; text-align: left; direction: ltr; margin-bottom: 15px; color: var(--text-main); }
        
        .option-btn { 
            background: white; border: 2px solid #f1f5f9; text-align: left; padding: 14px 18px; 
            margin-bottom: 10px; border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.15s;
            font-size: 16px; position: relative; direction: ltr; color: var(--text-main); font-family: 'Rubik', sans-serif;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); transform: translateX(3px); }
        
        .selected-correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #166534 !important; font-weight: 700; }
        .selected-wrong { background: #fee2e2 !important; border-color: var(--error) !important; color: #991b1b !important; opacity: 0.7; }

        /* --- Navigation Bar --- */
        .nav-bar {
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 20px; background: rgba(255,255,255,0.9); border-top: 1px solid #e2e8f0;
        }
        .nav-btn {
            background: transparent; border: none; font-weight: 700; color: var(--text-muted);
            font-size: 14px; cursor: pointer; padding: 10px; transition: 0.2s;
        }
        .nav-btn:hover:not(:disabled) { color: var(--primary); }
        .nav-btn:disabled { opacity: 0.3; cursor: default; }

        /* GHOST BUTTON */
        #nav-admin-btn {
            background: transparent; border: none; width: 60px; height: 40px; 
            cursor: default; display: flex; justify-content: center; align-items: center; font-size: 20px;
        }

        /* --- Levels --- */
        #level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .level-card {
            background: white; border-radius: 12px; padding: 12px 5px; text-align: center;
            cursor: pointer; transition: 0.2s; border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center;
        }
        .level-card:hover { transform: translateY(-2px); border-color: var(--primary); }
        .level-card.locked { opacity: 0.5; filter: grayscale(1); pointer-events: none; background: #f1f5f9; }
        .lvl-num { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
        .lvl-tag { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 8px; margin-top: 4px; }
        
        .tag-practice { background: #e0e7ff; color: var(--primary); }
        .tag-exam { background: #fef3c7; color: #d97706; border: 1px solid #fcd34d; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-container">

    <div id="admin-panel">
        <div class="adm-header" id="adm-head">
            <span>&lt;DEV_MODE /&gt;</span><span onclick="toggleAdmin()" style="cursor:pointer">✕</span>
        </div>
        <div class="adm-content">
            <button class="adm-btn" onclick="admSkip(-1)">[◀] PREV_Q</button>
            <button class="adm-btn" onclick="admSkip(1)">[▶] NEXT_Q</button>
            <button class="adm-btn" onclick="admWinLevel()">[🏆] FORCE_WIN</button>
            <button class="adm-btn" style="color:#10b981" onclick="admUnlock()">[🔓] UNLOCK_ALL</button>
        </div>
    </div>

    <div id="screen-welcome" class="screen active">
        <div style="text-align:center; margin-top:60px;">
            <div style="font-size:70px; margin-bottom:10px;">🎓</div>
            <h1>Bagrut Pro</h1>
            <p>5 Points Mastery</p>
        </div>
        <div style="flex:1"></div>
        <button class="main-btn" onclick="showCreate()">New Student</button>
        <div style="margin-top:20px;">
            <h4 style="color:var(--text-muted); font-size:0.8rem; text-align:center;">STUDENTS</h4>
            <div id="list-area" style="max-height:200px; overflow-y:auto; padding:0 10px;"></div>
        </div>
    </div>

    <div id="screen-create" class="screen">
        <div style="text-align:center; margin-top:40px;">
            <h2>Register</h2>
            <p>Enter your name (English)</p>
        </div>
        <div style="margin-top:30px;">
            <input type="text" id="inp-name" placeholder="Name...">
            <button class="main-btn" onclick="addPlayer()">Start</button>
            <button class="main-btn secondary" onclick="showWelcome()">Cancel</button>
        </div>
    </div>

    <div id="screen-levels" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div>
                <div style="font-size:0.7rem; color:var(--text-muted);">PLAYER</div>
                <div id="disp-name" style="font-weight:800; font-size:1.2rem; color:var(--text-main);">User</div>
            </div>
            <div style="background:rgba(99, 102, 241, 0.1); color:var(--primary); padding:6px 12px; border-radius:20px; font-weight:800;">
                💎 <span id="disp-coins">0</span>
            </div>
        </div>
        <div id="level-grid"></div>
        <button class="main-btn secondary" style="margin-top:auto;" onclick="saveAndExit()">Back</button>
    </div>

    <div id="screen-game" class="screen" style="padding:0;">
        <div style="height:4px; background:#e2e8f0; width:100%;"><div id="prog-bar" style="height:100%; background:linear-gradient(90deg, var(--primary), var(--accent)); width:0%; transition:0.4s;"></div></div>
        
        <div style="padding:12px 20px; display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.8);">
            <span onclick="quitLevel()" style="cursor:pointer; font-size:22px; color:var(--text-muted);">✕</span>
            <span style="font-weight:800; color:var(--primary);">Q <span id="q-num">1</span>/<span id="q-total">20</span></span>
            <button onclick="speak()" style="background:#e0e7ff; color:var(--primary); border:none; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:1.1rem;">🔊</button>
        </div>

        <div style="padding:20px; flex:1; overflow-y:auto; padding-bottom:0;">
            <div id="game-area"></div>
        </div>

        <div class="nav-bar">
            <button class="nav-btn" id="btn-prev" onclick="nav(-1)">Back</button>
            <button id="nav-admin-btn" onclick="unlockAdmin()"> </button>
            <button class="nav-btn" id="btn-next" onclick="nav(1)" style="color:var(--primary)">Next</button>
        </div>
    </div>

</div>

<script>
    // ==========================================
    // 📚 5-POINT DATA (Updated Vocabulary)
    // ==========================================
    const BAGRUT_PASSAGES = [
        {
            title: "The Ethics of Gene Editing",
            text: "CRISPR technology has revolutionized genetics by allowing precise editing of DNA. While it holds the promise of curing hereditary diseases, it raises profound ethical questions. Critics fear 'designer babies' where genetic enhancements are purchased by the wealthy, widening the social gap. Furthermore, the long-term ecological impact of altering species remains unknown. Regulatory bodies worldwide are struggling to keep pace with these rapid scientific advancements.",
            questions: [
                { q: "What is the main ethical concern regarding 'designer babies'?", a: "It could widen the social gap between rich and poor", opts: ["It will make babies too smart", "It is scientifically impossible", "It will reduce the population"] },
                { q: "What is unknown about gene editing according to the text?", a: "The long-term ecological impact", opts: ["The cost of the technology", "The speed of the process", "The name of the technology"] },
                { q: "What is the role of regulatory bodies?", a: "To balance innovation with moral responsibility", opts: ["To ban all science", "To promote designer babies", "To ignore the advancements"] }
            ],
            vocabTargets: [{w: "profound", s: "deep / significant"}, {w: "hereditary", s: "genetic / inherited"}, {w: "ecological", s: "environmental"}]
        },
        {
            title: "The Gig Economy",
            text: "The 'gig economy' has fundamentally shifted the traditional employment landscape. Platforms like Uber and Upwork offer workers unprecedented flexibility and autonomy. However, this shift has also sparked intense debate regarding worker rights. Critics argue that gig workers often lack the safety nets associated with traditional employment, such as health insurance and job security. As this sector grows, policymakers are grappling with how to update labor laws.",
            questions: [
                { q: "What is a key benefit of the gig economy for workers?", a: "Flexibility and autonomy", opts: ["Guaranteed salary", "Free health insurance", "Paid vacations"] },
                { q: "Why do critics worry about gig workers?", a: "They lack traditional safety nets", opts: ["They work too few hours", "They earn too much money", "They have too much security"] },
                { q: "What is the challenge for policymakers?", a: "Updating labor laws to protect workers", opts: ["Banning all apps", "Creating more freelance jobs", "Ignoring the problem"] }
            ],
            vocabTargets: [{w: "unprecedented", s: "never seen before"}, {w: "autonomy", s: "independence"}, {w: "grappling", s: "struggling"}]
        },
        {
            title: "Artificial Intelligence in Medicine",
            text: "The integration of AI into healthcare promises to revolutionize diagnostics. Algorithms can detect anomalies in medical imaging with greater accuracy than humans. However, issues regarding data privacy and potential algorithmic bias remain significant hurdles. Ultimately, the consensus is that AI should serve as a tool to augment, rather than replace, human medical expertise.",
            questions: [
                { q: "How does AI help in diagnostics?", a: "By detecting anomalies accurately", opts: ["By replacing all doctors", "By printing money", "By interviewing patients"] },
                { q: "What is a mentioned 'hurdle' or challenge?", a: "Algorithmic bias and privacy", opts: ["The speed of computers", "Lack of electricity", "Doctors' handwriting"] },
                { q: "What is the consensus on AI's role?", a: "To augment human expertise", opts: ["To take over hospitals", "To diagnose without humans", "To act as a nurse"] }
            ],
            vocabTargets: [{w: "anomalies", s: "abnormalities"}, {w: "augment", s: "enhance / support"}, {w: "consensus", s: "agreement"}]
        }
    ];

    // MERGED VOCABULARY LIST (50 Words)
    const BAND_III_VOCAB = [
        // User List
        {w:"abandon", s:"desert", o:["adopt","support","cherish"]},
        {w:"abundant", s:"plentiful", o:["scarce","rare","limited"]},
        {w:"acknowledge", s:"recognize", o:["ignore","deny","reject"]},
        {w:"adapt", s:"adjust", o:["resist","ignore","reject"]},
        {w:"adequate", s:"sufficient", o:["insufficient","poor","lacking"]},
        {w:"advantage", s:"benefit", o:["disadvantage","drawback","harm"]},
        {w:"affect", s:"influence", o:["ignore","avoid","protect"]},
        {w:"ambitious", s:"determined", o:["lazy","content","timid"]},
        {w:"anticipate", s:"expect", o:["ignore","avoid","forget"]},
        {w:"apparent", s:"obvious", o:["hidden","unclear","secret"]},
        {w:"append", s:"attach", o:["remove","detach","separate"]},
        {w:"appreciate", s:"value", o:["dislike","ignore","undervalue"]},
        {w:"approximate", s:"rough", o:["exact","precise","accurate"]},
        {w:"arbitrary", s:"random", o:["logical","planned","systematic"]},
        {w:"assert", s:"state", o:["suggest","hint","imply"]},
        {w:"assess", s:"evaluate", o:["ignore","overlook","neglect"]},
        {w:"assumption", s:"supposition", o:["fact","proof","certainty"]},
        {w:"authentic", s:"genuine", o:["fake","false","counterfeit"]},
        {w:"authority", s:"power", o:["weakness","subordination","impotence"]},
        {w:"automated", s:"automatic", o:["manual","human","hand-operated"]},
        
        // Base List
        {w:"Accomplish", s:"Achieve / Finish", o:["Fail","Destroy","Ignore"]},
        {w:"Accumulate", s:"Gather / Collect", o:["Scatter","Divide","Lose"]},
        {w:"Ambiguous", s:"Unclear / Vague", o:["Obvious","Definite","Clear"]},
        {w:"Appropriate", s:"Suitable / Fitting", o:["Incorrect","Wrong","Rude"]},
        {w:"Benefit", s:"Advantage / Profit", o:["Loss","Damage","Harm"]},
        {w:"Capable", s:"Able / Skilled", o:["Incompetent","Weak","Slow"]},
        {w:"Coincide", s:"Happen together", o:["Differ","Separate","Conflict"]},
        {w:"Commence", s:"Begin / Start", o:["End","Finish","Stop"]},
        {w:"Competent", s:"Efficient / Capable", o:["Clumsy","Unable","Silly"]},
        {w:"Consequence", s:"Result / Outcome", o:["Cause","Origin","Source"]},
        {w:"Considerable", s:"Significant / Large", o:["Tiny","Minor","Small"]},
        {w:"Consistent", s:"Steady / Constant", o:["Changing","Random","Erratic"]},
        {w:"Contradict", s:"Oppose / Deny", o:["Agree","Confirm","Accept"]},
        {w:"Crucial", s:"Critical / Important", o:["Trivial","Minor","Optional"]},
        {w:"Decline", s:"Refuse / Go down", o:["Accept","Increase","Rise"]},
        {w:"Demonstrate", s:"Show / Prove", o:["Hide","Cover","Guess"]},
        {w:"Deprive", s:"Take away", o:["Give","Supply","Offer"]},
        {w:"Deteriorate", s:"Get worse", o:["Improve","Heal","Fix"]},
        {w:"Devise", s:"Invent / Plan", o:["Destroy","Copy","Break"]},
        {w:"Diminish", s:"Decrease / Reduce", o:["Grow","Expand","Increase"]},
        {w:"Distinguish", s:"Differentiate", o:["Confuse","Mix","Ignore"]},
        {w:"Elaborate", s:"Detailed / Complex", o:["Simple","Basic","Plain"]},
        {w:"Emphasis", s:"Importance / Stress", o:["Neglect","Silence","Weakness"]},
        {w:"Endure", s:"Suffer / Last", o:["Quit","Stop","Die"]},
        {w:"Essential", s:"Necessary", o:["Optional","Extra","Unneeded"]},
        {w:"Evident", s:"Clear / Obvious", o:["Hidden","Secret","Vague"]},
        {w:"Exhaust", s:"Tire out / Use up", o:["Energize","Fill","Create"]},
        {w:"Fundamental", s:"Basic / Primary", o:["Advanced","Minor","Extra"]},
        {w:"Generate", s:"Create / Produce", o:["Destroy","Stop","End"]}
    ];

    const GRAMMAR = [
        {q:"Had I known, I _____ come.", a:"would have", o:["will have","would","have"]},
        {q:"_____ the rain, we went out.", a:"Despite", o:["Although","However","Because"]},
        {q:"He is the man _____ car was stolen.", a:"whose", o:["who","which","that"]},
        {q:"By 2030, they _____ completed it.", a:"will have", o:["will","has","had"]}
    ];

    // ==========================================
    // ⚙️ ENGINE (Fixed 4 Answers Logic)
    // ==========================================
    function generateLevel(level) {
        let qs = [];
        
        // --- BAGRUT SIMULATION (Levels 4, 5, 6) ---
        if (level >= 4 && level <= 6) {
            let pIdx = (level - 4) % BAGRUT_PASSAGES.length;
            let p = BAGRUT_PASSAGES[pIdx];
            
            p.questions.forEach(pq => {
                qs.push({ 
                    t:'unseen', text:p.text, title:p.title, 
                    q:pq.q, a:pq.a, 
                    opts: shuffle([pq.a, ...pq.opts]) 
                });
            });

            p.vocabTargets.forEach(v => {
                qs.push({ 
                    t:'vocab', q:`In the text, "${v.w}" means:`, 
                    a:v.s, 
                    opts: shuffle([v.s, "Opposite meaning", "Unrelated word", "Incorrect definition"]) 
                });
            });

            let needed = 20 - qs.length;
            for(let i=0; i<needed; i++) {
                if(Math.random()>0.5) addGrammar(qs); else addVocab(qs);
            }
            return qs;
        } 
        
        // --- STANDARD PRACTICE (1-3, 7-13) ---
        let attempts = 0;
        while(qs.length < 20 && attempts < 300) {
            attempts++;
            if((qs.length+1)%5===0) {
                let p = BAGRUT_PASSAGES[Math.floor(Math.random()*BAGRUT_PASSAGES.length)];
                let pq = p.questions[0];
                qs.push({ 
                    t:'unseen', text:p.text, title:p.title, 
                    q:pq.q, a:pq.a, 
                    opts: shuffle([pq.a, ...pq.opts]) 
                });
            } else if(Math.random()<0.5) {
                addVocab(qs);
            } else {
                addGrammar(qs);
            }
        }
        return qs;
    }

    function addVocab(arr) {
        let v = BAND_III_VOCAB[Math.floor(Math.random()*BAND_III_VOCAB.length)];
        let qObj = { 
            t:'vocab', q:`Synonym for: "${v.w}"`, 
            a:v.s, 
            opts: shuffle([v.s, ...v.o]) 
        };
        if(!arr.some(x=>x.q===qObj.q)) arr.push(qObj);
    }

    function addGrammar(arr) {
        let g = GRAMMAR[Math.floor(Math.random()*GRAMMAR.length)];
        let qObj = { 
            t:'grammar', q:g.q, 
            a:g.a, 
            opts: shuffle([g.a, ...g.o]) 
        };
        if(!arr.some(x=>x.q===qObj.q)) arr.push(qObj);
    }

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    // ==========================================
    // 📱 APP LOGIC
    // ==========================================
    const DB_KEY = 'bagrut_v27_final_fixed';
    let players = JSON.parse(localStorage.getItem(DB_KEY)) || [];
    let player = null;
    let questions = [];
    let qIdx = 0;

    window.onload = renderList;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(isAdmin) panel.style.display = "none";
    }
    function showWelcome() { showScreen('screen-welcome'); renderList(); }
    function showCreate() { document.getElementById('inp-name').value=""; showScreen('screen-create'); }

    function renderList() {
        const c = document.getElementById('list-area'); c.innerHTML = "";
        players.forEach((p,i) => {
            let d = document.createElement('div');
            d.className = "player-row";
            d.style = "background:white; border-radius:10px; padding:10px; margin-bottom:8px; display:flex; justify-content:space-between; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.05);";
            d.innerHTML = `<div style="flex:1" onclick="loadP(${i})">
                <div style="font-weight:700; color:var(--text-main)">${p.name}</div>
                <div style="font-size:0.8rem; color:var(--text-muted)">Lvl ${p.level} • 💎 ${p.coins}</div>
            </div> <div onclick="delP(${i})" style="color:var(--error); padding:10px">✕</div>`;
            c.appendChild(d);
        });
    }

    function addPlayer() {
        let n = document.getElementById('inp-name').value;
        if(!n) return;
        player = {name:n, coins:50, level:1};
        players.push(player); save(); loadLobby();
    }
    function loadP(i) { player = players[i]; loadLobby(); }
    function delP(i) { if(confirm("Delete?")) { players.splice(i,1); save(); renderList(); } }
    function save() { localStorage.setItem(DB_KEY, JSON.stringify(players)); }

    function loadLobby() {
        document.getElementById('disp-name').innerText = player.name;
        document.getElementById('disp-coins').innerText = player.coins;
        const g = document.getElementById('level-grid'); g.innerHTML="";
        
        for(let i=1; i<=13; i++) {
            let lk = i > player.level;
            let isExam = (i >= 4 && i <= 6);
            let d = document.createElement('div');
            d.className = `level-card ${lk?'locked':''}`;
            let tag = isExam ? '<span class="lvl-tag tag-exam">EXAM</span>' : '<span class="lvl-tag tag-practice">PRACTICE</span>';
            d.innerHTML = `<span class="lvl-num">${i}</span>${tag}`;
            if(!lk) d.onclick = () => startLevel(i);
            g.appendChild(d);
        }
        showScreen('screen-levels');
    }

    function saveAndExit() { save(); showWelcome(); }

    function startLevel(lvl) {
        questions = generateLevel(lvl);
        if(!questions || questions.length===0) { alert("Error generating level"); loadLobby(); return; }
        qIdx = 0;
        showScreen('screen-game');
        loadQ();
    }

    function loadQ() {
        if(qIdx >= questions.length) { finishLevel(); return; }
        const q = questions[qIdx];
        document.getElementById('q-num').innerText = qIdx + 1;
        document.getElementById('q-total').innerText = questions.length;
        document.getElementById('prog-bar').style.width = ((qIdx/questions.length)*100)+"%";
        
        let html = "";
        if(q.t === 'unseen') {
            html += `<div class="passage-container"><div class="passage-title">${q.title || "Reading"}</div>${q.text}</div>`;
        }
        html += `<div class="question-text">${q.q}</div><div id="opts"></div>`;
        document.getElementById('game-area').innerHTML = html;

        let answered = q.userAnswer !== undefined;

        q.opts.forEach(o => {
            let b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = o;
            
            if(answered) {
                b.disabled = true;
                if(o === q.a) b.classList.add('selected-correct');
                else if(o === q.userAnswer) b.classList.add('selected-wrong');
            } else {
                b.onclick = () => check(b, o, q.a);
            }
            document.getElementById('opts').appendChild(b);
        });
        updateNav();
    }

    function check(btn, sel, corr) {
        const q = questions[qIdx];
        if(sel === corr) {
            // Correct
            q.solved = true;
            q.userAnswer = sel;
            btn.classList.add('selected-correct');
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            if(!q.seen) { player.coins += 5; save(); }
            q.seen = true;
            updateNav();
            setTimeout(() => { if(qIdx < questions.length - 1) nav(1); else finishLevel(); }, 1000);
        } else {
            // Wrong - Must Win Logic
            btn.classList.add('selected-wrong');
            btn.disabled = true;
            q.seen = true;
        }
    }

    function nav(dir) {
        let next = qIdx + dir;
        if(next < 0) return;
        if(dir === 1 && !questions[qIdx].solved && !isAdmin) return;
        if(next >= questions.length) { finishLevel(); return; }
        qIdx = next;
        loadQ();
    }

    function updateNav() {
        document.getElementById('btn-prev').disabled = (qIdx === 0);
        document.getElementById('btn-next').disabled = !questions[qIdx].solved;
    }

    function finishLevel() {
        confetti({particleCount:150});
        if(player.level < 13) player.level++;
        save();
        alert("Level Complete! Outstanding.");
        loadLobby();
    }

    function speak() {
        let t = questions[qIdx].q.replace(/_+/g, " blank ");
        let u = new SpeechSynthesisUtterance(t);
        u.lang = "en-US"; window.speechSynthesis.speak(u);
    }
    
    function quitLevel() { if(confirm("Quit?")) loadLobby(); }

    // --- Admin ---
    let isAdmin = false;
    const panel = document.getElementById('admin-panel');
    const head = document.getElementById('adm-head');
    
    let isDown=false, offX, offY;
    head.addEventListener('mousedown', (e)=>{isDown=true; offX=e.offsetX; offY=e.offsetY});
    document.addEventListener('mouseup', ()=>{isDown=false});
    document.addEventListener('mousemove', (e)=>{
        if(!isDown)return;
        panel.style.left = (e.clientX - offX + 130) + 'px';
        panel.style.top = (e.clientY - offY) + 'px';
    });

    function unlockAdmin() {
        if(isAdmin) { toggleAdmin(); return; }
        if(prompt("Code")==="AAA") { 
            isAdmin=true; 
            let btn = document.getElementById('nav-admin-btn');
            btn.innerText="🔓"; 
            btn.style.color="var(--primary)";
            toggleAdmin(); 
        }
    }
    function toggleAdmin() { panel.style.display = panel.style.display==="none"?"block":"none"; }
    function admSkip(d) { nav(d); }
    function admWinLevel() { finishLevel(); }
    function admUnlock() { if(player){player.level=13;save();loadLobby();} }

    // --- PWA SERVICE WORKER REGISTRATION ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW Registered!', reg))
                .catch(err => console.log('SW Error:', err));
        });
    }

</script>
</body>
</html>
